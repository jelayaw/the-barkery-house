<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Shop freshly made dog treats from The Barkery House."
    >

    <title>Fresh Dog Treats | The Barkery House</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="site-header">

    <div class="container navbar">

        <a
            href="index.html"
            class="logo"
            aria-label="The Barkery House home"
        >
            THE BARKERY HOUSE
        </a>


        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <nav
            class="nav-links"
            aria-label="Main navigation"
        >

            <a href="index.html">
                Home
            </a>

            <a
                href="shop.html"
                aria-current="page"
            >
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="cart.html">
                Cart
            </a>

        </nav>

    </div>

</header>



<!-- =========================================
    <!-- =========================================
     PRODUCT PAGE
========================================= -->

<main>

    <section class="product-detail-section">

        <div
            class="container product-detail-grid"
            id="product-detail"
        >
            <p class="product-loading">
                Loading fresh treats...
            </p>
        </div>

    </section>


    <section
    class="related-products-section"
    id="related-products-section"
    hidden
>

        <div class="container">

            <div class="section-heading">

                <span>
                    MORE TAIL-WAGGING FAVORITES
                </span>

                <h2>
                    You May Also Like
                </h2>

            </div>

            <div
                class="related-products-grid"
                id="related-products"
            >
            </div>

        </div>

    </section>

</main>


<script src="js/product.js"></script>

</body>

</html>
