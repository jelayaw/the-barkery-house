<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Thank You | The Barkery House
    </title>

    <meta
        name="description"
        content="Thank you for your order from The Barkery House."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main>

        <section class="thank-you-section">

            <div
    class="container thank-you-container"
    id="thank-you-container"
>

                <span class="thank-you-eyebrow">
                    ORDER RECEIVED
                </span>

                <h1>
                    Thank You for Your Purchase!
                </h1>

                <p>
                    Your order has been received and
                    we're getting ready to bake up
                    something special for your pup.
                </p>

                <p class="thank-you-email-note">
                    A confirmation email with your
                    order details will be sent to you.
                </p>

                <a
                    href="shop.html"
                    class="thank-you-shop-button"
                >
                    Continue Shopping
                </a>

            </div>

        </section>

    </main>

<script src="js/thank-you.js"></script>

</body>

</html>
