<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Review your Barkery House shopping cart."
    >

    <title>Your Cart | The Barkery House</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="site-header">

    <div class="container navbar">

        <a
            href="index.html"
            class="logo"
            aria-label="The Barkery House home"
        >
            THE BARKERY HOUSE
        </a>


        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <nav
            class="nav-links"
            aria-label="Main navigation"
        >

            <a href="index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

            <a
                href="cart.html"
                aria-current="page"
            >
                Cart
            </a>

        </nav>

    </div>

</header>



<!-- =========================================
     CART
========================================= -->

<main>

    <section class="cart-section">

        <div class="container">

            <div class="cart-heading">

                <p class="eyebrow">
                    YOUR BARKERY BAG
                </p>

                <h1>Your Cart</h1>

                <p>
                    Fresh treats are almost on
                    their way to one lucky pup.
                </p>

            </div>


            <div
                id="cart-content"
                class="cart-layout"
                aria-live="polite"
            >

                <p class="cart-loading">
                    Loading your treats...
                </p>

            </div>

        </div>

    </section>

</main>


<script src="js/cart.js"></script>

</body>

</html>
